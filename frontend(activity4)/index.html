<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Favorite Songs</title>
    <link rel="stylesheet" href="/frontend(activity4)/assets/css/style.css">
</head>
<body>
    <main>
        <section id="list" class="container my-4">
            <div class="row menu">
                <div class="col-lg-6 col-md-12 mb-4">
                    <div class="main text-center">
                        <h1 class="text-light">Favorite Songs</h1>
                        <input id="searchInput" type="search" placeholder="Search songs..." class="form-control my-3" />
                        <ol class="list-group list-group-numbered" id="songList">
                            
                        </ol>
                        <input type="checkbox" id="hide">
                        <label for="hide" class="text-light">Hide List</label>
                    </div>
                </div>
                <div class="col-lg-6 col-md-12 my-4">
                    <div class="add p-4 rounded">
                        <h6 class="text-center text-light">Add SONG</h6>
                        <form>
                            <div class="mb-3">
                                <label for="title" class="form-label text-light fw-bold">Song Title</label>
                                <input type="text" class="form-control" placeholder="Enter song title" id="title">
                            </div>
                            <div class="mb-3">
                                <label for="artist" class="form-label text-light fw-bold">Artist Name</label>
                                <input type="text" class="form-control" placeholder="Enter artist name" id="artist">
                            </div>
                            <div class="d-grid">
                                <button type="button" class="btn btn-primary" id="addBtn">Add Song</button>
                            </div>
                        </form>
                        
                    </div>
                </div>
                <
                <div class="modal fade" id="editSongModal" tabindex="-1" aria-labelledby="editSongModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                        <h5 class="modal-title" id="editSongModalLabel">Edit Song</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                        <div class="mb-3">
                            <label for="editTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="editTitle" placeholder="Enter song title">
                        </div>
                        <div class="mb-3">
                            <label for="editArtist" class="form-label">Artist</label>
                            <input type="text" class="form-control" id="editArtist" placeholder="Enter artist name">
                        </div>
                        </div>
                        <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
                        </div>
                    </div>
                    </div>
                </div>
  
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/frontend(activity4)/assets/script/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
